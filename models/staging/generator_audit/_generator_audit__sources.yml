version: 2

# Sandbox-only answer key written by the generator. Tests compare model output with it.
# Models must never select from these tables: a real warehouse would not have them.
sources:
  - name: generator_audit
    database: raw
    schema: generator_audit
    description: >
      Facts the data generator knows about the data it produced: load metadata, control totals
      computed in Python, and counts of planted defects. Used only by tests in tests/.
    tables:
      - name: load_info
        description: One row describing the current load (as_of, seed, scale).
      - name: control_totals
        description: >
          Figures computed by the generator in Python, long format (metric, grain, period,
          line_of_business, value). Valid only for a load at their as_of.
      - name: planted_issues
        description: Rows affected per planted defect code (docs/data-issues.md).
