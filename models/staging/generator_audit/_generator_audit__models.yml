version: 2

models:
  - name: stg_generator_audit__load_info
    description: >
      The load's valuation date, one row. The only place models, macros, the analysis and tests
      get the valuation date from (D-024), so it always matches the loaded data. The only model
      that reads generator_audit, and it passes on nothing but this column: the control totals
      and planted-issue counts stay for tests. tests/generator_audit/assert_one_valuation_date.sql
      requires exactly one row, because every consumer cross joins it.
    columns:
      - name: valuation_date
        description: >
          The date the books are valued at: the last day the generator simulated (2026-09-30 on
          the default load). In-force status, earned premium, the receivable aging and the loss
          triangle's latest diagonal are all as of the end of this day.
        data_tests:
          - unique
          - not_null
