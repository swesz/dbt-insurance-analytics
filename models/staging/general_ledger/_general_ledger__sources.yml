version: 2

sources:
  - name: general_ledger
    database: raw
    schema: general_ledger
    description: >
      Journal lines exported from the ERP at each period close, one CSV file per period
      (gl_export_YYYY_MM.csv), loaded by a file connector (docs/source-systems.md 2d, 3h).
      Every business column arrives as text; staging parses them. A file that is exported again
      after a correction arrives as a second file for the same period, and both stay in the
      table (GL_FILE_REEXPORTED).
    config:
      # The file connector stamps every row with _fivetran_synced when it loads the file. A new
      # file arrives once a month, at the close (4th business day), so the warning allows a
      # month plus the close window: warn after 35 days, error after 45. `dbt source freshness`
      # compares with the wall clock, so a load of generated history reports stale by design;
      # `dbt build` does not run it.
      loaded_at_field: _fivetran_synced
      freshness:
        warn_after: {count: 35, period: day}
        error_after: {count: 45, period: day}
    tables:
      - name: journal_lines
        description: >
          One row per journal line per loaded file. Not unique on (journal_id, line_number):
          a re-exported period is in the table twice, once per file. Staging keeps one file per
          period, and the unique test lives there.
        columns:
          - name: journal_id
            description: "Journal identifier, e.g. 'JE-2024-06-0001'."
            data_tests:
              - not_null
          - name: line_number
            description: Line within the journal, as text.
            data_tests:
              - not_null
          - name: accounting_period
            description: "'YYYY-MM', as text."
            data_tests:
              - not_null
          - name: posting_date
            description: Posting date as US-format text, 'MM/DD/YYYY'.
          - name: account_number
            description: GL account, see seeds/gl_accounts.csv.
          - name: line_of_business
            description: AUTO or HOME.
          - name: debit
            description: Debit amount as text; empty when the line is a credit. From 2025-01 with thousands separators.
          - name: credit
            description: Credit amount as text; empty when the line is a debit. Same format as debit.
          - name: source_system
            description: POLICY_ADMIN, BILLING, CLAIMS or MANUAL.
          - name: description
            description: Free-text line description.
          - name: _file
            description: Source file name, e.g. 'gl_export_2024_06.csv'.
            data_tests:
              - not_null
          - name: _line
            description: Line number within the file.
          - name: _modified
            description: File modification time.
            data_tests:
              - not_null
          - name: _fivetran_synced
            description: When the connector loaded the row.
