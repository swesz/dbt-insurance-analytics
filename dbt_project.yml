name: insurance_analytics
version: "1.0.0"
profile: insurance_analytics
require-dbt-version: [">=1.12.0", "<2.0.0"]

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets: ["target", "dbt_packages"]

flags:
  # No usage telemetry: the project should behave the same offline and in CI.
  send_anonymous_usage_stats: false

vars:
  # The valuation date is not a var: models read it from the load, so it always matches the
  # data (models/staging/generator_audit/stg_generator_audit__load_info.sql, D-024).
  history_start_date: "2022-01-01"
  # fct_claim_transactions reprocesses rows loaded this many days before its high-water mark,
  # so late-arriving CDC rows are picked up (see the model's header).
  claims_incremental_lookback_days: 3

# Schemas name layers and domains, not environments: dev and prod are separate database files
# (profiles.yml), so both use the same schema names. macros/generate_schema_name.sql makes dbt
# use these names as they are, instead of prefixing them with the target schema.
models:
  insurance_analytics:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +materialized: table
      core:
        +schema: core
      premium:
        +schema: premium
      claims:
        +schema: claims
      accounting:
        +schema: accounting
      actuarial:
        +schema: actuarial

seeds:
  insurance_analytics:
    +schema: reference
    accounting_periods:
      +column_types:
        accounting_period: varchar
        period_start_date: date
        period_end_date: date
        close_date: date
        fiscal_year: integer
        fiscal_quarter: integer
    coverages:
      +column_types:
        annual_statement_line: varchar
        is_liability: boolean
    catastrophe_events:
      +column_types:
        start_date: date
        end_date: date
    gl_accounts:
      +column_types:
        account_number: varchar
    gl_reconciling_items:
      +column_types:
        accounting_period: varchar
        account_number: varchar
        line_of_business: varchar
        source_system: varchar
        amount: decimal(18, 2)
        item_type: varchar
        explanation: varchar

snapshots:
  insurance_analytics:
    +schema: snapshots
